problem:
  version: '0.4'
  shape:
#Inputs--SN, Outputs-SD, get sum(SN)
    name: SD

    dimensions: [B, H, M, P]

    data_spaces:
    - name: Inputs
      projection:
      - - - B
      - - - H
      - - - M
      - - - P
    - name: Outputs
      projection:
      - - - B
      - - - H
      - - - P
      read_write: True

  instance:
    B: 1      # Batch size
    H: 72     # Number of heads
    M: 2048   # Key
    P: 1   # Query